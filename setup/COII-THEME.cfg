# COII inventory presentation. Put these in server.cfg or inventory.cfg.
# Add exec inventory.cfg to server.cfg before ensure ox_inventory.
# Reapply edits with: exec inventory.cfg (after the first resource update).

# Colours accept #RGB or #RRGGBB. Accent/key text contrast is automatic.
setr inventory:ui:accent "#50B7F5"
setr inventory:ui:background "#0B1320"
setr inventory:ui:text "#FFFFFF"
setr inventory:ui:muted "#A7B3C4"
setr inventory:ui:border "#2A394D"
setr inventory:ui:pattern "#29405B"
setr inventory:ui:tile "#FFFFFF"

# Panel opacity: 0.25-1. Background-line opacity: 0-1 (0 hides the lines).
setr inventory:ui:opacity 1.0
setr inventory:ui:patternOpacity 0.18

# Heading: barlow / impact / arial. Body: barlow / arial / condensed.
setr inventory:ui:headingFont "barlow"
setr inventory:ui:bodyFont "barlow"

# Wheel diameter in viewport-height units: 48-72; narrow screens stay bounded.
setr inventory:ui:wheelSize 66
setr inventory:ui:tilt true
setr inventory:ui:animations true

# Inventory hover and treatment sound. Volume: 0-1.
setr inventory:ui:sounds true
setr inventory:ui:volume 1.0
